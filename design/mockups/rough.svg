<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!--
    Border roughening. Applied only to the pseudo-element that draws an outline,
    never to an element containing text, so letterforms stay crisp while the line
    around them wanders the way an inked one does.

    Three seeds, so adjacent controls do not repeat the same wobble and give the
    game away.
  -->
  <filter id="rough-1" x="-5%" y="-15%" width="110%" height="130%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-2" x="-5%" y="-15%" width="110%" height="130%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="23" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-3" x="-6%" y="-20%" width="112%" height="140%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4" seed="41" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- A heavier hand, for the one action that commits something. -->
  <filter id="rough-ink" x="-6%" y="-20%" width="112%" height="140%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="13" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
